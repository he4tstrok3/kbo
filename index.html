<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="2026 KBO 개막 엔트리로 즐기는 비공식 팬 제작 야구 감독 시뮬레이션">
<meta name="theme-color" content="#123227">
<title>더그아웃 감독실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 구장 수동 전광판 — 짙은 녹색 보드, 분필 글씨, 램프 앰버 숫자. 단일 다크 테마로 고정 */
:root{
  --board:#123227; --panel:#183f31; --panel-2:#21503e; --deep:#0b231a;
  --line:rgba(236,231,214,.15); --chalk:#ece7d6; --muted:#9db6a6;
  --lamp:#ffb73d;
  --grass:#1d5a3c; --grass2:#226b47; --grass-line:rgba(236,231,214,.18); --dirt:#7a5c3c; --hot:#ff6f52; --good:#8bdba6;
  --f-logo:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  --f-disp:'Gothic A1','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--board)}
body{color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.07) 3px 4px)}
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lamp{color:var(--lamp)}
.hot{color:var(--hot)}
.good{color:var(--good)}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:600;line-height:1.2;transition:border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--lamp)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--lamp);color:var(--deep);border-color:var(--lamp)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:5px}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:3px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.sec{font-size:22px;margin:0}
.secrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.badge{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);font-weight:500;white-space:nowrap}
.badge.fr{color:var(--lamp);border-color:rgba(255,183,61,.45)}
.badge.cl{color:var(--hot);border-color:rgba(255,111,82,.5)}
.r-hi{color:var(--lamp)} .r-lo{color:var(--muted)}

/* ---------- 타이틀 ---------- */
.title{display:grid;gap:28px}
.hero{display:grid;gap:10px;padding-block:18px 6px}
.hero h1{font-size:clamp(56px,11vw,120px);line-height:.9;color:var(--lamp);text-shadow:0 0 18px rgba(255,183,61,.25)}
.hero .lede{max-width:56ch;color:var(--chalk);font-size:17px;margin:0}
.cont{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--lamp);border-radius:8px;padding:14px 16px}
.car-wrap{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;cursor:grab;touch-action:pan-x pan-y;padding:6px 4px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
.car-nav{width:40px;height:56px;font-size:26px;padding:0;display:grid;place-items:center}
@media (max-width:560px){.car-wrap{grid-template-columns:minmax(0,1fr)}.car-nav{display:none}}
.tcard{flex:0 0 min(78vw,272px);scroll-snap-align:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;cursor:pointer;display:grid;gap:16px;align-content:start;position:relative;overflow:hidden;color:var(--chalk);min-height:420px;transition:transform .2s,border-color .2s}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--tc)}
.tcard[aria-pressed="true"]{border-color:var(--lamp);background:var(--panel-2);transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.tc-top{display:flex;align-items:center;gap:10px}
.tc-top .rk{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:44px;line-height:1;color:var(--tc)}
.tc-top .rk-l{font-size:12px;color:var(--muted);line-height:1.35}
.tc-top .rk-l b{color:var(--chalk);font-weight:600;font-size:13px}
.tc-name{display:grid;gap:4px}
.tc-name .nick{font-family:var(--f-body);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.tc-name .mgr{font-size:14px;color:var(--muted)}
.rbars{display:grid;gap:8px}
.rbar{display:grid;grid-template-columns:34px minmax(0,1fr) 26px;align-items:center;gap:8px;font-size:13px}
.rbar i{height:8px;border-radius:4px;background:var(--deep);position:relative;overflow:hidden;display:block}
.rbar i b{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:4px}
.rbar.best i b{background:var(--lamp)}
.rbar .num{text-align:right;font-weight:600}
.keys{margin:0;display:grid;gap:7px;border-top:1px solid var(--line);padding-top:12px}
.keys div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;font-size:13px}
.keys dt{color:var(--muted)}
.keys dd{margin:0;min-width:0}
.keys dd .num{color:var(--muted);font-size:12px}
.pick-chip{justify-self:start;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tcard[aria-pressed="true"] .pick-chip{background:var(--lamp);color:var(--deep);border-color:var(--lamp);font-weight:700}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dot-b{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot-b.on{background:var(--tc);transform:scale(1.4)}
.startbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2}
.startbar .btn{box-shadow:0 8px 20px rgba(0,0,0,.35)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--chalk);color:var(--deep);border-color:var(--chalk)}
.note{font-size:13px;color:var(--muted);max-width:70ch;margin:0}

/* ---------- 허브 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.top .brand{font-family:var(--f-logo);font-weight:400;font-size:26px;color:var(--lamp);line-height:1}
.top .mine{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .recd{font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-block:14px 18px;padding-bottom:2px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--chalk);border-color:var(--lamp)}
.stack{display:grid;gap:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.match .side{display:grid;gap:4px;min-width:0}
.match .side.r{text-align:right;justify-items:end}
.match .nick{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:clamp(24px,5vw,38px);line-height:1.05}
.match .vs{text-align:center;font-family:var(--f-disp);font-size:20px;color:var(--muted)}
.match .vs small{display:block;font-family:var(--f-body);font-size:12px}
.sp{font-size:13px;color:var(--muted)}
.sp b{color:var(--chalk);font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.results{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.results li{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:5px;font-size:14px}
.results li.me{background:var(--panel-2)}
.results .a{text-align:right}
.results .w{font-weight:700}
.results .l{color:var(--muted)}
.results .sc{font-family:var(--f-num);color:var(--lamp);font-variant-numeric:tabular-nums}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t th{font-size:12px;color:var(--muted);font-weight:500;background:var(--deep);position:sticky;top:0}
table.t td.l,table.t th.l{text-align:left}
table.t td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.t td.l{font-family:var(--f-body)}
table.t tr.me td{background:rgba(255,183,61,.08)}
table.t tr.cut td{border-bottom:2px dashed var(--lamp)}
table.t tr.next td{background:rgba(139,219,166,.08)}
.t .mini{flex-wrap:nowrap;white-space:nowrap;gap:8px}
.t td .ctl,.t td .btn{white-space:nowrap}
.fat{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--deep);vertical-align:middle;position:relative;overflow:hidden}
.fat b{position:absolute;inset:0 auto 0 0;background:var(--good)}
.fat.mid b{background:var(--lamp)} .fat.hi b{background:var(--hot)}
.ctl{display:inline-flex;gap:4px}

.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.lead h3{font-size:17px;margin-bottom:6px}
.lead ol{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.lead li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center}
.lead li .num{color:var(--lamp)}
.lead li:first-child{font-weight:700}
.lead li.empty{display:block;font-weight:400;font-size:13px}

.bracket{display:grid;gap:8px}
.bk{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.bk.cur{border-color:var(--lamp)}
.bk .rn{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:16px}
.champ{text-align:center;padding:28px 16px;border:2px solid var(--lamp);border-radius:10px;background:var(--panel);display:grid;gap:8px;justify-items:center}
.champ .big{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:clamp(36px,8vw,64px);color:var(--lamp);line-height:1}

/* ---------- 경기 ---------- */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.board{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;box-shadow:inset 0 0 0 4px rgba(0,0,0,.25)}
.ls{border-collapse:separate;border-spacing:3px;width:100%}
.ls th{font-size:12px;color:var(--muted);font-weight:500;padding:2px 0}
.ls th.tn{text-align:left;padding-right:12px;color:var(--chalk);font-size:15px;white-space:nowrap;font-weight:700}
.ls td{min-width:30px;height:38px;text-align:center;background:var(--board);font-family:var(--f-num);color:var(--lamp);font-size:18px;border-radius:2px}
.ls td.on{box-shadow:inset 0 0 0 2px var(--lamp)}
.ls td.R{background:var(--panel-2);color:var(--chalk);font-weight:600;font-size:21px;min-width:40px}
.ls td.H{color:var(--chalk);opacity:.8}
.ggrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;margin-top:16px}
@media (max-width:820px){.ggrid{grid-template-columns:minmax(0,1fr)}}
.fieldcol,.ctrlcol{display:grid;gap:12px;align-content:start;min-width:0}
.sit{display:flex;justify-content:space-between;align-items:center;gap:12px}
.inn{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:34px;line-height:1}
.inn small{font-family:var(--f-body);font-size:13px;color:var(--muted);display:block;margin-top:4px}
.outs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.outs i{width:16px;height:16px;border-radius:50%;border:2px solid var(--hot);display:inline-block}
.outs i.on{background:var(--hot);box-shadow:0 0 10px rgba(255,111,82,.6)}
.diamond{width:100%;max-width:340px;justify-self:center;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:5px;min-width:0}
.pc.mine{border-color:rgba(255,183,61,.5)}
.pc .role{font-size:11px;color:var(--muted);letter-spacing:.06em}
.pc .nm{font-weight:700;font-size:17px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc .ln{font-size:13px}
.mini{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mini b{font-family:var(--f-num);font-weight:600;color:var(--chalk)}
.mini b.r-hi{color:var(--lamp)} .mini b.r-lo{color:var(--muted)}
.meter{height:6px;background:var(--deep);border-radius:3px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--good)}
.meter.mid b{background:var(--lamp)} .meter.hi b{background:var(--hot)}
.act{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.act .who{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:20px}
.act .hint{font-size:13px;color:var(--muted);margin:0}
.act .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.act .grid .btn{text-align:left}
.act .auto{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.final{font-family:var(--f-disp);font-weight:800;letter-spacing:-.02em;font-size:40px;line-height:1}
.pbp{list-style:none;margin:0;padding:0;max-height:440px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--deep)}
.pbp li{padding:7px 12px;border-bottom:1px solid var(--line);font-size:14px}
.pbp li.inn{background:var(--panel);color:var(--muted);font-size:12px;letter-spacing:.06em;position:sticky;top:0}
.pbp li.out{color:var(--muted)}
.pbp li.run{color:var(--lamp)}
.pbp li.hr{color:var(--lamp);font-weight:700}
.pbp li.hit{color:var(--chalk)}
.pbp li.chg{color:var(--good)}
.pbp li.end{color:var(--chalk);font-weight:700;background:var(--panel-2)}
@keyframes flash{from{background:rgba(255,183,61,.25)}to{background:transparent}}
.pbp li.new{animation:flash .9s ease-out}

/* ---------- 모달 ---------- */
.ovl{position:fixed;inset:0;background:rgba(5,15,11,.72);display:grid;place-items:center;padding:16px;z-index:10}
.mdl{background:var(--panel);border:1px solid var(--lamp);border-radius:10px;padding:16px;width:min(560px,100%);max-height:84vh;overflow:auto;display:grid;gap:12px}
.mdl h3{font-size:20px}
.pick{display:grid;gap:6px}
.pick button{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.pick button:hover:not(:disabled){border-color:var(--lamp)}
.pick button:disabled{opacity:.4;cursor:not-allowed}
.pick .mini{grid-column:1/-1}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.tlist{display:grid;gap:4px;max-height:420px;overflow-y:auto;padding-right:4px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
.trow .mini{grid-column:1/-1}
.trow .tn{min-width:0;font-weight:600}
.trow:hover{border-color:var(--muted)}
.trow[aria-pressed="true"]{border-color:var(--lamp);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--lamp)}
.vbar{height:8px;border-radius:4px;background:var(--hot);overflow:hidden}
.vbar b{display:block;height:100%;background:var(--good)}
.offer{background:var(--panel);border:1px solid var(--lamp);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.cnt{display:grid;grid-template-columns:auto repeat(3,16px);gap:5px 6px;align-items:center;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.cnt i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;display:inline-block;opacity:.55}
.cnt i.b{color:var(--good)} .cnt i.s{color:var(--lamp)} .cnt i.o{color:var(--hot)}
.cnt i.on{background:currentColor;opacity:1;box-shadow:0 0 8px currentColor}
.cnt span:nth-of-type(n+2){grid-column:1}
.crow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:center}
.clbl{font-size:12px;color:var(--muted)}
.crow .seg .btn[aria-pressed="true"]{background:var(--chalk);color:var(--deep);border-color:var(--chalk)}
.pseq{list-style:none;margin:0;padding:8px 10px;display:grid;gap:3px;background:var(--deep);border-radius:6px;font-size:13px;max-height:180px;overflow-y:auto}
.pseq li.out{color:var(--muted)} .pseq li.hit{color:var(--chalk)} .pseq li.run{color:var(--lamp)} .pseq li.info{color:var(--chalk);opacity:.85}
.rec{background:var(--deep);border:1px dashed rgba(255,183,61,.5);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.rec .rline{font-size:14px}
.rec .why{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--lamp);width:16px;height:16px}
.wbox{max-width:620px;display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.wbox h2{font-size:clamp(30px,6vw,42px);color:var(--lamp)}
.wbox p{margin:0;font-size:16px;line-height:1.65}
.nform{display:grid;gap:8px;margin-top:8px}
.nform label{font-weight:700;font-size:16px}
.nrow{display:flex;gap:8px;flex-wrap:wrap}
.nrow input{flex:1 1 200px;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--deep);color:var(--chalk)}
.nrow input:focus{outline:2px solid var(--lamp);outline-offset:1px}
.linkbtn{background:none;border:0;padding:0;color:var(--lamp);text-decoration:underline;cursor:pointer;font-size:13px}

/* ===== 게임 화면 공통 ===== */
.screen{position:relative;min-height:100dvh;display:grid;align-content:center;justify-items:center;padding-block:28px 150px;margin-inline:-16px;padding-inline:16px;overflow:hidden}
.stage{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 50% 35% at 12% -8%,rgba(255,244,214,.22),transparent 70%),

      const mid=['SS','2B','CF'].includes(pos);

  const ai=pick(S.teams.filter(t=>t.id!==S.my));
  const pool=tradeable(mine).filter(id=>S.gday>=P(id).injUntil&&ovr(P(id))>=52).sort((a,b)=>ovr(P(b))-ovr(P(a))).slice(2,16);
  if(!pool.length)return;
  const target=pick(pool),tv=tval(P(target));
  const cands=tradeable(ai).filter(id=>S.gday>=P(id).injUntil).sort((a,b)=>ovr(P(b))-ovr(P(a))).slice(2);
  let best=null,bd=1e9;
  for(let i=0;i<cands.length;i++){const v=pkgVal([cands[i]]),d=Math.abs(v-tv*1.05);if(d<bd){bd=d;best=[cands[i]]}
    for(let j=i+1;j<Math.min(cands.length,i+12);j++){const v2=pkgVal([cands[i],cands[j]]),d2=Math.abs(v2-tv*1.05);if(d2<bd){bd=d2;best=[cands[i],cands[j]]}}}
  if(!best||bd>tv*.35)return;
  (S.offers||(S.offers=[])).push({id:'o'+S.gday+rint(0,999),from:ai.id,give:best,take:[target],exp:S.gday+3});
}

function carCards(){const car=document.getElementById('carousel');return car?[...car.querySelectorAll('.tcard')]:[]}

function goCard(id,smooth){
  const car=document.getElementById('carousel');if(!car)return;
  const c=carCards().find(x=>+x.dataset.tid===id);if(!c)return;
  car.scrollTo({left:centerOf(car,c),behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'auto'});

function bindCarousel(keep){
  const car=document.getElementById('carousel');if(!car)return;
  if(keep!==null&&keep!==undefined)car.scrollLeft=keep;
  else{const c=carCards().find(x=>+x.dataset.tid===TS.sel);if(c)car.scrollLeft=centerOf(car,c)}
  let tm=null;
  car.addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{
    if(car.classList.contains('drag'))return;
    const mid=car.scrollLeft+car.clientWidth/2;let best=null,bd=1e9;
    carCards().forEach(c=>{const d=Math.abs(c.offsetLeft+c.clientWidth/2-mid);if(d<bd){bd=d;best=c}});
    if(best&&+best.dataset.tid!==TS.sel)markSel(+best.dataset.tid);
  },90)},{passive:true});
  // 마우스로 끌어서 넘기기
  let down=null;
  car.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down={x:e.clientX,l:car.scrollLeft,moved:false}});
  window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;if(Math.abs(dx)>5){down.moved=true;car.classList.add('drag')}if(down.moved)car.scrollLeft=down.l-dx},{passive:true});
  window.addEventListener('pointerup',e=>{if(!down)return;const d=down;down=null;if(!d.moved)return;
    car.classList.remove('drag');TS.dragged=true;setTimeout(()=>TS.dragged=false,50);
    const dx=e.clientX-d.x,order=carCards().map(c=>+c.dataset.tid),i=order.indexOf(TS.sel);
    const mid=car.scrollLeft+car.clientWidth/2;let best=i,bd=1e9;carCards().forEach((c,k)=>{const dd=Math.abs(c.offsetLeft+c.clientWidth/2-mid);if(dd<bd){bd=dd;best=k}});
    if(best===i&&Math.abs(dx)>40)best=clamp(i+(dx<0?1:-1),0,order.length-1);
    goCard(order[best],true)});
}

function lineHTML(g){

  return h+'</tbody></table>';
}

function pitcherCard(g,mine){

  const outs=g.po[id]||0,runs=g.pr[id]||0;
  return`<div class="pc ${mine?'mine':''}"><span class="role">투수 · ${p.role==='SP'?'선발':p.role==='CL'?'마무리':'구원'}</span><span class="nm">${pName(p)}</span>
    <span class="ln">${ip(outs)}이닝 ${runs}실점 · 투구수 <b class="num ${r>1?'hot':r>.85?'lamp':''}">${pc}</b></span>
    <div class="meter ${r>1?'hi':r>.8?'mid':''}" title="투구 한계 대비"><b style="width:${clamp(r*100,2,100)}%"></b></div>
    <div class="mini">구위 <b class="${rc(p.stf)}">${p.stf}</b> 제구 <b class="${rc(p.ctl)}">${p.ctl}</b> 체력 <b class="${rc(p.sta)}">${p.sta}</b></div></div>`;
}

      ${segRow('노림수','sit',[['none','없음'],['FF','직구'],['BR','변화구']])}

      <div class="grid">${ops.map(([k,l,d,dis])=>`<button class="btn" data-act="g" data-arg="${k}" ${dis?'disabled':''}>${l}<small>${d}</small></button>`).join('')}</div>

  const lim=limitOf(p),pc=effPC(g,pid),tr=getTr(b);
  const fld=1-g.half,visits=2-g.visits[fld],pko=2-(g.pko||0);
  const avail=S.teams[S.my].bullpen.filter(id=>!g.used[us].includes(id));
  const scout=[tr.weak==='FF'?'직구에 약함':tr.weak==='BR'?'변화구에 약함':'약점 없음',tr.hot==='high'?'높은 공에 강함':tr.hot==='low'?'낮은 공에 강함':''].filter(Boolean).join(' · ');
  const ops=[['pickoff',`견제 (${pko})`,'주자 묶기, 가끔 견제사',!((r1&&!r2)||(r2&&!r3))||pko<=0],
    ['pitchout','피치아웃','도루·스퀴즈 간파용, 볼 하나',!g.bases.some(Boolean)],
    ['ibb','고의사구','거르고 다음 타자',false],
    ['visit',`마운드 방문 (${visits})`,'숨 고르기, 피로 일부 회복',visits<=0],

  return`<div class="act"><span class="eyebrow">${S.teams[S.my].nick} 수비 · ${g.outs}아웃 · ${c.b}-${c.s}</span>

    ${segRow('높이','ht',[['high','높게'],['low','낮게']])}

    <div class="grid">${ops.map(([k,l,d,dis])=>`<button class="btn" data-act="g" data-arg="${k}" ${dis?'disabled':''}>${l}<small>${d}</small></button>`).join('')}</div>
    <p class="hint ${pc>lim?'hot':''}">타자 분석: ${scout} · 투구수 ${pc}/${Math.round(lim)}${pc>lim?' — 한계를 넘어 구위가 떨어지고 있습니다':''}</p>
    ${pseqHTML(g)}${auto}</div>`;
}

function userStep(arg){
  const g=S.cur;if(!g||g.over)return;ensureCnt(g);
  const us=g.T[0]===S.my?0:1,batting=g.half===us;
  if(arg==='ph'){modalPH();return}
  if(arg==='change'){modalRP();return}
  if(arg==='pr'){modalPR();return}
  if(arg==='recPitch'){recStep(g);return}
  if(arg==='toKey'){let k=0;do{recStep(g);k++}while(!g.over&&k<1500&&!keyMoment(g));return}
  if(S.autoRec&&(arg==='pp'||arg==='paAuto'))applyRecSet(g,curRec(g));
  const samePA=(h,bo)=>!g.over&&g.half===h&&g.bo[h]===bo;
  if(arg==='autoHalf'){const h=g.half,inn=g.inning;let k=0;while(!g.over&&g.half===h&&g.inning===inn&&k++<400)aiPitchStep(g)}
  else if(arg==='autoGame'){let k=0;while(!g.over&&k++<4000)aiPitchStep(g)}
  else if(batting){
    if(arg==='paAuto'){const h=g.half,bo=g.bo[h];let k=0;while(samePA(h,bo)&&k++<25){if(S.autoRec)applyRecSet(g,curRec(g));throwPitch(g,{...g.ui,act:null},aiDefPitch(g))}}
    else throwPitch(g,{...g.ui,act:['bunt','squeeze','hrun','steal','dsteal'].includes(arg)?arg:null},aiDefPitch(g));
  }else{
    const def={pt:g.ui.pt,loc:g.ui.loc,ht:g.ui.ht,align:g.ui.align,pitchout:arg==='pitchout'};
    if(arg==='ibb'){runPA(g,'ibb');resetPA(g)}
    else if(arg==='pickoff')pickoff(g);
    else if(arg==='visit')visit(g);
    else if(arg==='paAuto'){const h=g.half,bo=g.bo[h];let k=0;while(samePA(h,bo)&&k++<25)throwPitch(g,aiOffPitch(g),{...aiDefPitch(g),align:g.ui.align})}
    else throwPitch(g,aiOffPitch(g),def);
  }
  afterStep(g,0);
}
function afterStep(g,depth){
  if(g.over||depth>3)return;ensureCnt(g);
  const us=g.T[0]===S.my?0:1;
  if(g.half===us&&g.cnt.b===0&&g.cnt.s===0&&!g.pseq.length){aiPitch(g,1-g.half);if(aiDef(g)==='ibb'){runPA(g,'ibb');resetPA(g);return afterStep(g,depth+1)}}
  if(g.half!==us){const rep=getRep(P(g.pit[1-g.half]));if(!rep.some(r=>r.k===g.ui.pt))g.ui.pt=rep[0].k}
  if(S.autoRec&&!g.over)applyRecSet(g,curRec(g));
}
function pickoff(g){
  ensureCnt(g);if((g.pko||0)>=2)return;
  const i=g.bases[1]&&!g.bases[2]?1:g.bases[0]?0:-1;if(i<0)return;
  const rid=g.bases[i],p=P(rid);g.pko=(g.pko||0)+1;g.held=1;g.pc[g.pit[1-g.half]]+=1;
  if(R()<.03+(p.spd>=70?.02:0)){g.bases[i]=null;addOut(g,1);log(g,`견제사! ${p.name} 아웃`,'out');g.pseq.push({t:`견제사 — ${p.name} 아웃`,k:'out'});if(g.outs>=3){resetPA(g);checkHalf(g)}}
  else g.pseq.push({t:`견제구 — ${p.name} 귀루`,k:'info'});
}
function visit(g){
  ensureCnt(g);const fld=1-g.half;if(g.visits[fld]>=2)return;
  g.visits[fld]++;const pid=g.pit[fld];g.pcAdj[pid]=(g.pcAdj[pid]||0)-8;
  log(g,`투수코치 마운드 방문 — ${P(pid).name} 숨 고르기`,'chg');g.pseq.push({t:'마운드 방문',k:'info'});
}
function modalPR(){
  const g=S.cur,us=g.half;
  const rows=g.bases.map((rid,i)=>rid?`<p class="eyebrow" style="margin-top:6px">${i+1}루 주자 ${esc(P(rid).name)} (주력 ${P(rid).spd})</p>${g.bench[us].map(id=>{const p=P(id);return`<button data-act="doPR" data-arg="${i}|${id}"><b>${pName(p)}</b><span class="num">주력 ${p.spd}</span></button>`}).join('')}`:'').join('');
  MODAL=`<h3>대주자 기용</h3><p class="note">들어간 선수가 그 타순을 이어받고, 빠진 선수는 이 경기에 다시 나올 수 없습니다.</p><div class="pick">${rows}</div><button class="btn ghost" data-act="closeModal">취소</button>`;
}

  postQuick:()=>postSimOne(),
  postSeries:()=>{const r=S.post.round;let k=0;while(S.phase==='post'&&S.post.round===r&&k++<20)postSimOne()},
  postAll:()=>{let k=0;while(S.phase==='post'&&k++<60){const s=S.post.ser;if(s.hi===S.my||s.lo===S.my){/* 내 팀 경기도 자동 진행 */}postSimOne()}},
  newSeason:()=>newSeason(),
  ftab:a=>{S.ftab=a},
  down:id=>{const t=S.teams[S.my];if(downBlock(t,id))return;t.active=t.active.filter(x=>x!==id);t.futures.push(id);t.down[id]=S.gday+RECALL_DAYS;normRoster(t);S.tx.push({d:S.gday+1,n:P(id).name,k:'말소'})},
  up:id=>{const t=S.teams[S.my];if(upBlock(t,id))return;t.futures=t.futures.filter(x=>x!==id);t.active.push(id);delete t.down[id];normRoster(t);S.tx.push({d:S.gday+1,n:P(id).name,k:'등록'})},
  toRot:id=>modalRot(id),
  doRot:a=>{const [id,i]=a.split('|');const t=S.teams[S.my];if(P(id).role==='CL')P(id).role='RP';t.rotation[+i]=id;normRoster(t);MODAL=''},
  askRelease:id=>{const p=P(id),t=S.teams[S.my];const left=p.fr==='F'?REP_F-t.repF:REP_A-t.repA;
    MODAL=`<h3>${esc(p.name)} 방출</h3><p class="note">방출한 선수는 되돌릴 수 없습니다. 이번 시즌 남은 ${p.fr==='F'?'외국인':'아시아쿼터'} 교체 횟수는 ${left}회${S.day>=signDeadline()?'이고, 교체 마감이 지나 새 선수를 뽑을 수 없습니다':''}.</p>
    <div class="btnrow"><button class="btn primary" data-act="doRelease" data-arg="${id}">방출하기</button><button class="btn ghost" data-act="closeModal">취소</button></div>`},
  doRelease:id=>{if(inGame())return;releasePlayer(S.teams[S.my],id);buildTeamOf();MODAL=''},
  sign:id=>{const t=S.teams[S.my];if(signBlock(t,id))return;signPlayer(t,id);buildTeamOf()},
  tpartner:a=>{S.trade={partner:+a,give:[],take:[],msg:null}},
  tsel:a=>{const [side,id]=a.split('|');const tr=S.trade;const k=side==='g'?'give':'take';
    if(tr[k].includes(id))tr[k]=tr[k].filter(x=>x!==id);else if(tr[k].length<3)tr[k].push(id);tr.msg=null},
  tclear:()=>{S.trade.give=[];S.trade.take=[];S.trade.msg=null},
  propose:()=>{const tr=S.trade,t=S.teams[S.my];if(tradeBlock()||!tr.give.length||!tr.take.length||t.ask[tr.partner]===S.gday)return;
    const odds=tradeOdds(tr.partner,tr.give,tr.take);t.ask[tr.partner]=S.gday;const pt=S.teams[tr.partner];
    if(R()<odds){doTrade(S.my,tr.give,tr.partner,tr.take);tr.msg={ok:true,text:`트레이드 성사! ${tr.take.map(id=>P(id).name).join(', ')} 선수가 합류합니다.`};tr.give=[];tr.take=[]}
    else{const [band]=oddsBand(odds);tr.msg={ok:false,text:band==='높음'||band==='보통'?`${pt.nick} 프런트가 고민 끝에 거절했습니다. 내일 다시 제안해 보세요.`:`${pt.nick}: "그 조건으로는 어렵습니다." 카드를 더 얹어야 할 것 같습니다.`}}},
  acceptOffer:oid=>{const o=(S.offers||[]).find(x=>x.id===oid);if(!o||tradeBlock())return;doTrade(S.my,o.take,o.from,o.give);S.offers=S.offers.filter(x=>x!==o)},
  declineOffer:oid=>{S.offers=(S.offers||[]).filter(x=>x.id!==oid)},
  rename:()=>{TS.named=false},
  introGo:()=>{S.screen='hub';S.tab='lineup'},
  closeModal:()=>{MODAL=''},
  closeBg:(a,el,e)=>{if(e.target===el)MODAL=''},
};
if(typeof document!=='undefined'){
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]');if(!el)return;
    const f=ACT[el.dataset.act];if(!f)return;
    if(el.dataset.act==='closeBg'&&e.target!==el)return;
    if(f(el.dataset.arg,el,e)==='skip')return;
    if(S)save();render();
  });
  document.addEventListener('submit',e=>{
    if(e.target.id!=='nameForm')return;e.preventDefault();
    const v=(document.getElementById('coachName').value||'').trim().slice(0,12);
    if(!v){TS.nameErr=true;render();return}
    TS.name=v;TS.named=true;TS.nameErr=false;TS.recenter=true;render();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&MODAL){MODAL='';render();return}
    if((e.key===' '||e.key==='Enter')&&S&&S.screen==='game'&&!MODAL&&e.target===document.body){
      e.preventDefault();const b=document.querySelector('.act .btn.primary');if(b)b.click();
    }
  });
  TS.league=newLeague(TS.len);
  render();
}
</script>

</body>
</html>
